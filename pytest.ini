[pytest]
# Shell AI — pytest configuration
# Run the whole suite with:  pytest
# Run just one group with:   pytest tests/test_phase1_phase2.py -v

# Automatically recognise `async def test_*` as coroutine tests
# (requires pytest-asyncio, already in requirements.txt)
asyncio_mode = auto

# Default timeout so a hung tool doesn't freeze CI forever
timeout = 60

# Where to discover tests
testpaths = tests
pythonpath = .

# File / function naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Quieter output by default; use -v for verbose
addopts =
    --strict-markers
    --strict-config
    -ra
    --tb=short

# Silence known external-library deprecation noise that we don't control.
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::FutureWarning:google.*
    ignore::DeprecationWarning:pydantic.*
    ignore::UserWarning:pytest_asyncio.*
