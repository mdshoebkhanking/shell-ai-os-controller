name: Bug report
description: Report something that is broken or unstable.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove secrets, tokens, emails, chat IDs, and private screenshots before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue clearly.
      placeholder: Shell crashed when I clicked Start Voice...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Shell
        2. Go to Voice
        3. Click Start Voice
        4. See error
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS / Ubuntu
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shell version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only safe logs. Redact secrets.
      render: text
