name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SHELL_PRODUCTION_MODE: "1"
  SHELL_PUBLIC_RELEASE: "1"

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shell_web_ui/package-lock.json

      - name: Build Shell Web UI
        run: |
          npm ci
          npm run build
        working-directory: shell_web_ui

      - name: Syntax compile
        run: |
          python -m py_compile \
            agent.py \
            shell_ui/shell_cinematic_full.py \
            shell_tool_gateway.py \
            shell_telegram.py \
            tools/package_public_release.py \
            tools/production_readiness.py \
            tools/repo_audit.py \
            tools/ui_ux_audit.py \
            tools/cloud_readiness_audit.py \
            tools/agent_ecosystem_audit.py \
            tools/launch_readiness_audit.py \
            tools/public_github_launch_audit.py \
            tools/ecosystem_master_audit.py

      - name: Run tests
        run: python -m pytest -q

  release-check:
    name: Release integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shell_web_ui/package-lock.json

      - name: Build Shell Web UI
        run: |
          npm ci
          npm run build
        working-directory: shell_web_ui

      - name: Public release strict check
        run: python tools/production_release_check.py --strict

      - name: Config diagnostics
        run: python tools/config_diagnostics.py --fail-on-error

      - name: Build public package
        run: python tools/package_public_release.py

      - name: Production readiness score
        run: python tools/production_readiness.py

      - name: Enterprise diagnostics
        run: python tools/enterprise_diagnostics.py --fail-on-attention

      - name: UI/UX audit
        run: python tools/ui_ux_audit.py --fail-on-high

      - name: Cloud and API readiness audit
        run: python tools/cloud_readiness_audit.py --fail-on-high

      - name: Agent ecosystem readiness audit
        run: python tools/agent_ecosystem_audit.py --fail-on-high

      - name: Launch readiness audit
        run: python tools/launch_readiness_audit.py --fail-on-high

      - name: Public GitHub launch audit
        run: python tools/public_github_launch_audit.py --fail-on-high

      - name: Ecosystem master audit
        run: python tools/ecosystem_master_audit.py --fail-on-high

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: shell-ai-os-controller-package
          path: |
            dist/shell-ai-os-controller-*.zip
            dist/public_release_package.json
          if-no-files-found: error
