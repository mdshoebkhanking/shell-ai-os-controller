name: Release

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, for example 1.0.0"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUNBUFFERED: "1"
  SHELL_PRODUCTION_MODE: "1"
  SHELL_PUBLIC_RELEASE: "1"

jobs:
  package:
    name: Build release package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Validate version input
        if: ${{ inputs.version != '' }}
        run: |
          test "$(cat VERSION)" = "${{ inputs.version }}"

      - name: Run tests
        run: python -m pytest -q

      - name: Config diagnostics
        run: python tools/config_diagnostics.py --fail-on-error

      - name: Build package
        run: python tools/package_public_release.py

      - name: Create checksums
        run: |
          cd dist
          shasum -a 256 shell-ai-os-controller-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Production readiness
        run: python tools/production_readiness.py

      - name: Enterprise diagnostics
        run: python tools/enterprise_diagnostics.py --fail-on-attention

      - name: UI/UX audit
        run: python tools/ui_ux_audit.py --fail-on-high

      - name: Cloud and API readiness audit
        run: python tools/cloud_readiness_audit.py --fail-on-high

      - name: Agent ecosystem readiness audit
        run: python tools/agent_ecosystem_audit.py --fail-on-high

      - name: Launch readiness audit
        run: python tools/launch_readiness_audit.py --fail-on-high

      - name: Public GitHub launch audit
        run: python tools/public_github_launch_audit.py --fail-on-high

      - name: Ecosystem master audit
        run: python tools/ecosystem_master_audit.py --fail-on-high

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: shell-ai-os-controller-release
          path: |
            dist/shell-ai-os-controller-*.zip
            dist/SHA256SUMS.txt
            dist/public_release_package.json
          if-no-files-found: error

      - name: Attest release package
        uses: actions/attest@v4
        with:
          subject-path: "dist/shell-ai-os-controller-*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/shell-ai-os-controller-*.zip
            dist/SHA256SUMS.txt
            dist/public_release_package.json
          generate_release_notes: true

  windows-installer:
    name: Build Windows setup EXE
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shell_web_ui/package-lock.json

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install pyinstaller PyQt6-WebEngine PyOpenGL GPUtil pyttsx3 edge-tts sounddevice SpeechRecognition pynput keyboard

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows setup EXE
        run: python tools/build_windows_installer.py --skip-release-check

      - name: Create Windows installer checksum
        shell: pwsh
        run: |
          Get-FileHash dist\shell-ai-os-controller-setup-*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content dist\SHA256SUMS-WINDOWS.txt
          Get-Content dist\SHA256SUMS-WINDOWS.txt

      - name: Upload Windows setup artifact
        uses: actions/upload-artifact@v7
        with:
          name: shell-ai-os-controller-windows-setup
          path: |
            dist/shell-ai-os-controller-setup-*.exe
            dist/SHA256SUMS-WINDOWS.txt
            dist/windows_installer_package.json
          if-no-files-found: error

      - name: Attest Windows setup EXE
        uses: actions/attest@v4
        with:
          subject-path: "dist/shell-ai-os-controller-setup-*.exe"

      - name: Attach Windows setup to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/shell-ai-os-controller-setup-*.exe
            dist/SHA256SUMS-WINDOWS.txt
            dist/windows_installer_package.json
          generate_release_notes: true

  windows-installer-branch-artifact:
    name: Build Windows setup EXE branch artifact
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref_type == 'branch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shell_web_ui/package-lock.json

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install pyinstaller PyQt6-WebEngine PyOpenGL GPUtil pyttsx3 edge-tts sounddevice SpeechRecognition pynput keyboard

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows setup EXE
        run: python tools/build_windows_installer.py --skip-release-check

      - name: Create Windows installer checksum
        shell: pwsh
        run: |
          Get-FileHash dist\shell-ai-os-controller-setup-*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content dist\SHA256SUMS-WINDOWS.txt
          Get-Content dist\SHA256SUMS-WINDOWS.txt

      - name: Upload Windows setup artifact
        uses: actions/upload-artifact@v7
        with:
          name: shell-ai-os-controller-windows-setup
          path: |
            dist/shell-ai-os-controller-setup-*.exe
            dist/SHA256SUMS-WINDOWS.txt
            dist/windows_installer_package.json
          if-no-files-found: error
