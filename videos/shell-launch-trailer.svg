<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Shell AI launch trailer storyboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset=".55" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#051015"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".45" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
    <style>
      .kicker{font:800 16px Inter,Segoe UI,Arial,sans-serif;letter-spacing:4px;fill:#22d3ee}
      .title{font:900 54px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .sub{font:650 22px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .small{font:650 17px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .cardTitle{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#e0f2fe}
      @keyframes scan{0%{transform:translateX(-420px)}100%{transform:translateX(1260px)}}
      @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
      .scan{animation:scan 5s linear infinite}
      .blink{animation:blink 1.8s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity=".22">
    <path d="M0 610 C220 510 360 646 560 554 S910 445 1280 540" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path d="M0 646 C250 568 430 704 640 598 S960 512 1280 592" fill="none" stroke="#64748b" stroke-width="1"/>
  </g>
  <rect class="scan" y="0" width="260" height="720" fill="#67e8f9" opacity=".08"/>
  <g transform="translate(84 88)">
    <text x="0" y="0" class="kicker">OFFICIAL PUBLIC RELEASE</text>
    <text x="0" y="74" class="title">Shell AI OS Controller</text>
    <text x="4" y="118" class="sub">A transparent AI operating layer for chat, voice, tools, automation, and runtime diagnostics.</text>
  </g>
  <g transform="translate(920 104)">
    <rect x="0" y="0" width="230" height="230" rx="46" fill="url(#metal)" opacity=".95"/>
    <path d="M51 112 C78 45 164 35 190 91 C154 82 118 95 94 124 C76 146 64 164 40 178 C52 151 41 136 51 112Z" fill="#05070b"/>
    <circle cx="115" cy="132" r="62" fill="#05070b"/>
    <circle class="blink" cx="115" cy="132" r="26" fill="#f8fafc"/>
    <g stroke="#f8fafc" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M76 126 L58 108"/><path d="M86 96 V72"/><path d="M116 88 V62"/><path d="M144 100 L168 78"/>
      <path d="M74 150 L52 172"/><path d="M104 168 V196"/><path d="M136 168 L158 190"/><path d="M154 136 H184"/>
    </g>
  </g>
  <g transform="translate(84 274)">
    <rect width="332" height="210" rx="24" fill="#0b1220" stroke="#164e63"/>
    <text x="28" y="42" class="cardTitle">1. Fast conversation</text>
    <text x="28" y="78" class="small">Streaming text-first responses with voice on demand.</text>
    <rect x="28" y="112" width="224" height="28" rx="14" fill="#082f49"/>
    <rect x="28" y="154" width="276" height="28" rx="14" fill="#111827"/>
  </g>
  <g transform="translate(474 274)">
    <rect width="332" height="210" rx="24" fill="#0b1220" stroke="#164e63"/>
    <text x="28" y="42" class="cardTitle">2. Tool automation</text>
    <text x="28" y="78" class="small">Permission-aware tool execution with traceable results.</text>
    <path d="M44 146 H286" stroke="#22d3ee" stroke-width="5" stroke-dasharray="18 12"/>
    <circle cx="88" cy="146" r="14" fill="#22d3ee"/><circle cx="188" cy="146" r="14" fill="#22c55e"/>
  </g>
  <g transform="translate(864 274)">
    <rect width="332" height="210" rx="24" fill="#0b1220" stroke="#164e63"/>
    <text x="28" y="42" class="cardTitle">3. Operations center</text>
    <text x="28" y="78" class="small">Health, logs, runtime state, and launch audits.</text>
    <rect x="30" y="118" width="76" height="58" rx="14" fill="#06313b"/>
    <rect x="128" y="104" width="76" height="72" rx="14" fill="#082f49"/>
    <rect x="226" y="132" width="76" height="44" rx="14" fill="#064e3b"/>
  </g>
  <text x="84" y="582" class="sub">Demo video script: install -> launch -> chat -> voice -> tools -> diagnostics -> safe automation.</text>
  <text x="84" y="626" class="small">Use this storyboard for YouTube, README previews, release notes, and launch social media.</text>
</svg>
