<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shell AI voice and tools UI</title>
  <desc id="desc">Current Shell AI voice interface and guarded tools panel, showing the particle orb, manual controls, and tool execution path.</desc>
  <defs>
    <radialGradient id="orb" cx="50%" cy="48%" r="55%"><stop offset="0" stop-color="#9FFBFF"/><stop offset="0.55" stop-color="#22D3EE"/><stop offset="1" stop-color="#0E7490" stop-opacity="0"/></radialGradient>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#060911"/><stop offset="0.5" stop-color="#09121C"/><stop offset="1" stop-color="#061F24"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#111827" stop-opacity="0.96"/><stop offset="1" stop-color="#0B1724" stop-opacity="0.86"/></linearGradient>
    <style>.font{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.text{fill:#F8FAFC}.muted{fill:#94A3B8}.dim{fill:#64748B}.cyan{fill:#22D3EE}.green{fill:#64E6AE}.violet{fill:#A78BFA}.card{fill:url(#panel);stroke:#4B6B82;stroke-width:1.4}.label{font-size:13px;letter-spacing:6px;font-weight:900}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect y="0" width="1600" height="66" fill="#05080D"/><text x="28" y="42" class="font text" font-size="26" font-weight="900">Shell</text><text x="114" y="38" class="font cyan label">VOICE CORE + TOOLS</text><circle cx="1546" cy="33" r="18" fill="#67E8F9"/><text x="1540" y="40" class="font" font-size="16" font-weight="900" fill="#001015">U</text>
  <rect y="66" width="275" height="834" fill="#050911"/><circle cx="44" cy="120" r="22" fill="#67E8F9"/><text x="37" y="128" class="font" font-size="18" font-weight="900" fill="#07111A">S</text><text x="80" y="118" class="font cyan" font-size="20" font-weight="900" letter-spacing="3">SHELL_OS</text><text x="80" y="139" class="mono muted" font-size="12" letter-spacing="2">V9.1.0-STABLE</text>
  <rect x="24" y="178" width="230" height="54" rx="15" fill="#22D3EE"/><text x="86" y="211" class="font" font-size="16" font-weight="900" fill="#04111A">+ New Session</text><rect x="24" y="246" width="230" height="44" rx="15" fill="#0B1320" stroke="#1E3A4C"/><text x="48" y="273" class="font muted" font-size="14">Search...</text>
  <text x="88" y="340" class="font muted label">CHAT</text><rect x="24" y="370" width="230" height="52" rx="16" fill="#06242C" stroke="#22D3EE"/><rect x="24" y="374" width="4" height="44" rx="2" fill="#22D3EE"/><text x="88" y="403" class="font cyan label">VOICE</text><text x="88" y="462" class="font muted label">SYSTEM</text><text x="88" y="516" class="font muted label">TOOLS</text><text x="88" y="570" class="font muted label">SETTINGS</text>

  <g transform="translate(350 102)">
    <rect x="520" y="0" width="320" height="42" fill="#0E1724" stroke="#36566D"/><circle cx="560" cy="21" r="5" fill="#67E8F9"/><text x="602" y="26" class="font cyan label">SYSTEM LISTENING</text>
    <g transform="translate(405 108)">
      <circle cx="270" cy="185" r="178" fill="url(#orb)" opacity="0.28"/>
      <g fill="#7CEBFA" opacity="0.88">
        <circle cx="270" cy="185" r="8"/><circle cx="225" cy="145" r="6"/><circle cx="316" cy="142" r="6"/><circle cx="206" cy="198" r="6"/><circle cx="342" cy="206" r="6"/><circle cx="250" cy="248" r="6"/><circle cx="296" cy="252" r="6"/>
        <circle cx="190" cy="120" r="4"/><circle cx="350" cy="112" r="4"/><circle cx="170" cy="260" r="4"/><circle cx="390" cy="250" r="4"/><circle cx="250" cy="88" r="4"/><circle cx="294" cy="88" r="4"/><circle cx="230" cy="306" r="4"/><circle cx="326" cy="310" r="4"/>
      </g>
      <g fill="#67E8F9" opacity="0.35">
        <circle cx="146" cy="168" r="4"/><circle cx="406" cy="166" r="4"/><circle cx="148" cy="214" r="4"/><circle cx="404" cy="212" r="4"/><circle cx="194" cy="82" r="3"/><circle cx="360" cy="78" r="3"/><circle cx="160" cy="310" r="3"/><circle cx="384" cy="318" r="3"/>
      </g>
    </g>
    <text x="560" y="528" text-anchor="middle" class="font text" font-size="20">"How can I assist your neural operations?"</text>
    <text x="560" y="553" text-anchor="middle" class="font muted" font-size="15">Manual trigger remains available when wake word is off.</text>
    <g transform="translate(436 590)">
      <circle cx="0" cy="0" r="30" fill="#111827" stroke="#36566D"/><text x="-18" y="54" class="font muted label">MUTE</text>
      <circle cx="105" cy="0" r="36" fill="#22D3EE"/><text x="72" y="54" class="font cyan label">TERMINATE</text>
      <circle cx="230" cy="0" r="30" fill="#111827" stroke="#36566D"/><text x="198" y="54" class="font muted label">VISUALS</text>
    </g>
    <rect x="18" y="642" width="418" height="128" rx="24" class="card"/><text x="54" y="692" class="font violet label">SYNTHETIC VOICE</text><text x="54" y="744" class="font text" font-size="16">Gemini route + local fallback diagnostics</text>
    <rect x="784" y="642" width="418" height="128" rx="24" class="card"/><text x="820" y="692" class="font cyan label">TOOL HANDOFF</text><text x="820" y="744" class="font text" font-size="16">Voice → STT → NL router → guarded tools</text>
  </g>
</svg>
