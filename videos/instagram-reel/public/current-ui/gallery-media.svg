<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shell AI gallery and media workflow</title>
  <desc id="desc">Current Shell AI gallery UI showing generated image cards, save/reveal/delete actions, and media tool routing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#05080D"/><stop offset="0.55" stop-color="#09121C"/><stop offset="1" stop-color="#061F24"/></linearGradient>
    <linearGradient id="art1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#7C3AED"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
    <linearGradient id="art2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#64E6AE"/><stop offset="0.6" stop-color="#0E7490"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style>.font{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.text{fill:#F8FAFC}.muted{fill:#94A3B8}.dim{fill:#64748B}.cyan{fill:#22D3EE}.green{fill:#64E6AE}.card{fill:#0B1320;stroke:#4B6B82;stroke-width:1.4}.label{font-size:13px;letter-spacing:6px;font-weight:900}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect y="0" width="1600" height="66" fill="#05080D"/><text x="28" y="42" class="font text" font-size="26" font-weight="900">Shell</text><text x="114" y="38" class="font cyan label">MEDIA GALLERY</text><circle cx="1546" cy="33" r="18" fill="#67E8F9"/><text x="1540" y="40" class="font" font-size="16" font-weight="900" fill="#001015">U</text>
  <rect y="66" width="275" height="834" fill="#050911"/><circle cx="44" cy="120" r="22" fill="#67E8F9"/><text x="37" y="128" class="font" font-size="18" font-weight="900" fill="#07111A">S</text><text x="80" y="118" class="font cyan" font-size="20" font-weight="900" letter-spacing="3">SHELL_OS</text><text x="80" y="139" class="mono muted" font-size="12" letter-spacing="2">V9.1.0-STABLE</text><rect x="24" y="178" width="230" height="54" rx="15" fill="#22D3EE"/><text x="86" y="211" class="font" font-size="16" font-weight="900" fill="#04111A">+ New Session</text><text x="88" y="340" class="font muted label">CHAT</text><text x="88" y="394" class="font muted label">VOICE</text><text x="88" y="448" class="font muted label">SYSTEM</text><text x="88" y="502" class="font muted label">TOOLS</text><rect x="24" y="528" width="230" height="52" rx="16" fill="#06242C" stroke="#22D3EE"/><rect x="24" y="532" width="4" height="44" rx="2" fill="#22D3EE"/><text x="88" y="561" class="font cyan label">GALLERY</text>
  <g transform="translate(330 102)">
    <text x="0" y="0" class="font text" font-size="32" font-weight="950">Gallery + Image Workflow</text><text x="0" y="30" class="font muted" font-size="15">Generated media is saved to Shell Gallery with reveal, copy, delete, and audit-friendly paths.</text>
    <rect x="0" y="70" width="380" height="610" rx="24" class="card"/><rect x="34" y="108" width="312" height="290" rx="20" fill="url(#art1)"/><circle cx="132" cy="208" r="64" fill="#67E8F9" opacity="0.72"/><path d="M70 342 C135 250 215 250 314 342 Z" fill="#020617" opacity="0.72"/><text x="34" y="448" class="font text" font-size="20" font-weight="900">Neon shell city</text><text x="34" y="480" class="font muted" font-size="15">Saved in Shell_Generated</text><rect x="34" y="522" width="86" height="36" rx="13" fill="#22D3EE"/><text x="58" y="546" class="font" font-size="12" font-weight="900" fill="#06111A">OPEN</text><rect x="136" y="522" width="92" height="36" rx="13" fill="#111827" stroke="#4B6B82"/><text x="160" y="546" class="font cyan" font-size="12" font-weight="900">COPY</text><rect x="244" y="522" width="92" height="36" rx="13" fill="#111827" stroke="#4B6B82"/><text x="266" y="546" class="font cyan" font-size="12" font-weight="900">REVEAL</text>
    <rect x="420" y="70" width="380" height="610" rx="24" class="card"/><rect x="454" y="108" width="312" height="290" rx="20" fill="url(#art2)"/><rect x="496" y="162" width="220" height="145" rx="24" fill="#04111A" opacity="0.52"/><circle cx="608" cy="234" r="54" fill="#64E6AE" opacity="0.62"/><text x="454" y="448" class="font text" font-size="20" font-weight="900">Tool result preview</text><text x="454" y="480" class="font muted" font-size="15">Image path returned to chat</text><rect x="454" y="522" width="104" height="36" rx="13" fill="#22D3EE"/><text x="482" y="546" class="font" font-size="12" font-weight="900" fill="#06111A">SAVE</text><rect x="574" y="522" width="112" height="36" rx="13" fill="#111827" stroke="#4B6B82"/><text x="604" y="546" class="font cyan" font-size="12" font-weight="900">DELETE</text>
    <rect x="840" y="70" width="420" height="610" rx="24" class="card"/><text x="878" y="126" class="font text" font-size="23" font-weight="950">Media Tool Route</text><text x="878" y="178" class="font muted" font-size="16">Prompt</text><rect x="878" y="200" width="330" height="54" rx="14" fill="#050914" stroke="#4B6B82"/><text x="900" y="235" class="font text" font-size="16">generate a futuristic shell UI</text><text x="878" y="312" class="font muted" font-size="16">Backend</text><rect x="878" y="336" width="330" height="52" rx="14" fill="#101A29" stroke="#4B6B82"/><text x="900" y="368" class="font cyan" font-size="15" font-weight="900">shell_image_ai:generate_image_tool</text><text x="878" y="446" class="font muted" font-size="16">Gallery state</text><rect x="878" y="470" width="330" height="52" rx="14" fill="#101A29" stroke="#4B6B82"/><text x="900" y="502" class="font green" font-size="15" font-weight="900">saved, rendered, and indexed</text><text x="878" y="590" class="font muted" font-size="15">No fake success: missing keys return clear diagnostics.</text>
  </g>
</svg>
