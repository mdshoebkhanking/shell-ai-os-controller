<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shell AI chat and chart control UI</title>
  <desc id="desc">Current Shell AI chat UI with a text transcript, chart command lane, local tool routing, and text-only reply behavior.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#05080D"/><stop offset="0.55" stop-color="#09121C"/><stop offset="1" stop-color="#062129"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#111827" stop-opacity="0.96"/><stop offset="1" stop-color="#0B1724" stop-opacity="0.86"/></linearGradient>
    <style>.font{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.text{fill:#F8FAFC}.muted{fill:#94A3B8}.dim{fill:#64748B}.cyan{fill:#22D3EE}.green{fill:#64E6AE}.card{fill:url(#panel);stroke:#4B6B82;stroke-width:1.4}.label{font-size:13px;letter-spacing:6px;font-weight:900}</style>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1160" cy="96" r="190" fill="#0E7490" opacity="0.16" filter="url(#soft)"/><circle cx="550" cy="780" r="220" fill="#7C3AED" opacity="0.09" filter="url(#soft)"/>
  <rect y="0" width="1600" height="66" fill="#05080D"/><text x="28" y="42" class="font text" font-size="26" font-weight="900">Shell</text><text x="114" y="38" class="font cyan label">CORE INTERFACE</text><circle cx="1546" cy="33" r="18" fill="#67E8F9"/><text x="1540" y="40" class="font" font-size="16" font-weight="900" fill="#001015">U</text>
  <rect y="66" width="275" height="834" fill="#050911"/><circle cx="44" cy="120" r="22" fill="url(#cyan)"/><text x="37" y="128" class="font" font-size="18" font-weight="900" fill="#07111A">S</text><text x="80" y="118" class="font cyan" font-size="20" font-weight="900" letter-spacing="3">SHELL_OS</text><text x="80" y="139" class="mono muted" font-size="12" letter-spacing="2">V9.1.0-STABLE</text>
  <rect x="24" y="178" width="230" height="54" rx="15" fill="url(#cyan)"/><text x="86" y="211" class="font" font-size="16" font-weight="900" fill="#04111A">+ New Session</text><rect x="24" y="246" width="230" height="44" rx="15" fill="#0B1320" stroke="#1E3A4C"/><text x="48" y="273" class="font muted" font-size="14">Search...</text>
  <rect x="24" y="316" width="230" height="52" rx="16" fill="#06242C" stroke="#22D3EE"/><rect x="24" y="320" width="4" height="44" rx="2" fill="#22D3EE"/><text x="88" y="349" class="font cyan label">CHAT</text>
  <text x="88" y="408" class="font muted label">VOICE</text><text x="88" y="462" class="font muted label">SYSTEM</text><text x="88" y="516" class="font muted label">TOOLS</text><text x="88" y="570" class="font muted label">SETTINGS</text>

  <g transform="translate(330 112)">
    <text x="0" y="0" class="font text" font-size="32" font-weight="950">Chat + Chart Control</text><text x="0" y="30" class="font muted" font-size="15">Text commands stay text-only. Tool execution and chart requests use the same guarded backend.</text>
    <rect x="0" y="64" width="760" height="560" rx="26" class="card"/>
    <g transform="translate(38 42)">
      <rect x="0" y="72" width="684" height="92" rx="18" fill="#101A29" stroke="#2B5268"/><circle cx="34" cy="118" r="14" fill="#67E8F9"/><text x="66" y="111" class="font cyan label">USER</text><text x="66" y="141" class="font text" font-size="18">show CPU chart and remember this task</text>
      <rect x="0" y="190" width="684" height="142" rx="18" fill="#0B1420" stroke="#2B5268"/><circle cx="34" cy="236" r="14" fill="#A78BFA"/><text x="66" y="229" class="font cyan label">SHELL</text><text x="66" y="261" class="font text" font-size="18">CPU chart opened. I saved the context for recall.</text><text x="66" y="294" class="font green" font-size="15" font-weight="900">Reply mode: text only</text>
      <rect x="0" y="358" width="684" height="92" rx="18" fill="#101A29" stroke="#2B5268"/><circle cx="34" cy="404" r="14" fill="#67E8F9"/><text x="66" y="397" class="font cyan label">USER</text><text x="66" y="427" class="font text" font-size="18">calculate 45 * 18</text>
      <rect x="0" y="476" width="684" height="64" rx="16" fill="#050914" stroke="#4B6B82"/><text x="28" y="516" class="font muted" font-size="18">Message Shell...</text><circle cx="640" cy="508" r="23" fill="url(#cyan)"/><text x="633" y="517" class="font" font-size="22" font-weight="900" fill="#04111A">›</text>
    </g>
    <rect x="790" y="64" width="470" height="560" rx="26" class="card"/>
    <text x="826" y="118" class="font text" font-size="22" font-weight="900">Live Chart Rail</text><text x="826" y="158" class="font muted label">TELEMETRY PROMPT</text>
    <rect x="826" y="186" width="398" height="48" rx="13" fill="#050914" stroke="#36566D"/><text x="850" y="216" class="font text" font-size="15">show network chart</text><rect x="1154" y="197" width="48" height="26" rx="10" fill="#22D3EE"/><text x="1167" y="216" class="font" font-size="12" font-weight="900" fill="#06111A">RUN</text>
    <g transform="translate(826 270)"><rect x="0" y="0" width="398" height="220" rx="18" fill="#07111C" stroke="#24465C"/><polyline points="20,165 64,138 108,152 152,90 196,118 240,72 284,86 328,52 378,74" fill="none" stroke="#67E8F9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#64E6AE"><circle cx="64" cy="138" r="5"/><circle cx="152" cy="90" r="5"/><circle cx="240" cy="72" r="5"/><circle cx="328" cy="52" r="5"/></g></g>
    <text x="826" y="544" class="font green" font-size="18" font-weight="900">Result: chart updated in the dashboard.</text>
    <text x="826" y="582" class="font muted" font-size="15">No voice playback unless the turn starts from voice.</text>
  </g>
</svg>
