<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shell AI settings, API keys, and Telegram controls</title>
  <desc id="desc">Current Shell AI settings UI with visual theme, voice sensitivity, neural engine keys, Telegram remote control, and scrollable settings panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#05080D"/><stop offset="0.55" stop-color="#09121C"/><stop offset="1" stop-color="#07242C"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#121B2B" stop-opacity="0.96"/><stop offset="1" stop-color="#0B1724" stop-opacity="0.86"/></linearGradient>
    <style>.font{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.text{fill:#F8FAFC}.muted{fill:#94A3B8}.dim{fill:#64748B}.cyan{fill:#22D3EE}.green{fill:#64E6AE}.violet{fill:#A78BFA}.card{fill:url(#panel);stroke:#4B6B82;stroke-width:1.4}.label{font-size:13px;letter-spacing:6px;font-weight:900}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect y="0" width="1600" height="66" fill="#05080D"/><text x="28" y="42" class="font text" font-size="26" font-weight="900">Shell</text><text x="114" y="38" class="font cyan label">CONFIGURATION</text><circle cx="1546" cy="33" r="18" fill="#8EA4FF"/><text x="1540" y="40" class="font" font-size="16" font-weight="900" fill="#001015">U</text>
  <rect y="66" width="275" height="834" fill="#050911"/><circle cx="44" cy="120" r="22" fill="#9AE6FF"/><text x="37" y="128" class="font" font-size="18" font-weight="900" fill="#07111A">S</text><text x="80" y="118" class="font cyan" font-size="20" font-weight="900" letter-spacing="3">SHELL_OS</text><text x="80" y="139" class="mono muted" font-size="12" letter-spacing="2">V9.1.0-STABLE</text>
  <rect x="24" y="178" width="230" height="54" rx="15" fill="#22D3EE"/><text x="86" y="211" class="font" font-size="16" font-weight="900" fill="#04111A">+ New Session</text><rect x="24" y="246" width="230" height="44" rx="15" fill="#0B1320" stroke="#1E3A4C"/><text x="48" y="273" class="font muted" font-size="14">Search...</text>
  <text x="88" y="340" class="font muted label">CHAT</text><text x="88" y="394" class="font muted label">VOICE</text><text x="88" y="448" class="font muted label">SYSTEM</text><rect x="24" y="474" width="230" height="52" rx="16" fill="#06242C" stroke="#22D3EE"/><rect x="24" y="478" width="4" height="44" rx="2" fill="#22D3EE"/><text x="88" y="507" class="font cyan label">SETTINGS</text>
  <g transform="translate(330 102)">
    <text x="0" y="0" class="font text" font-size="32" font-weight="950">Configuration</text><text x="0" y="28" class="font muted" font-size="15">Calibrate the core interface, providers, voice, and remote control gates.</text>
    <rect x="0" y="58" width="630" height="320" rx="24" class="card"/><rect x="30" y="88" width="54" height="54" rx="14" fill="#30264F"/><circle cx="58" cy="116" r="7" fill="#A78BFA"/><text x="114" y="144" class="font text" font-size="22" font-weight="900">Visual Theme</text><text x="114" y="206" class="font muted" font-size="16">Switch between themes for different visual experiences.</text><rect x="114" y="256" width="470" height="58" rx="22" fill="#07111C" stroke="#2B5268"/><rect x="124" y="264" width="137" height="42" rx="18" fill="#7DEBFA"/><text x="172" y="291" class="font" font-size="13" font-weight="900" letter-spacing="4" fill="#06111A">DARK</text><text x="316" y="291" class="font muted label">LIGHT</text><text x="448" y="291" class="font muted label">CYBER</text>
    <rect x="660" y="58" width="600" height="320" rx="24" class="card"/><text x="710" y="126" class="font text" font-size="22" font-weight="900">Voice Sensitivity</text><text x="710" y="190" class="font muted" font-size="16">Adjust how aggressively the AI interrupts or listens.</text><rect x="710" y="242" width="504" height="56" rx="24" fill="#101A29" stroke="#4B6B82"/><rect x="730" y="268" width="340" height="7" rx="4" fill="#67E8F9"/><circle cx="1078" cy="271" r="13" fill="#F8FAFC" stroke="#22D3EE" stroke-width="3"/><text x="710" y="348" class="font muted label">PASSIVE</text><text x="900" y="348" class="font cyan label">REACTIVE (65%)</text><text x="1124" y="348" class="font muted label">AGGRESSIVE</text>
    <rect x="0" y="404" width="1260" height="362" rx="24" class="card"/><text x="46" y="462" class="font text" font-size="24" font-weight="950">Neural Engine Keys</text><text x="46" y="520" class="font muted" font-size="16">API keys and remote access controls stay inside Settings &gt; API Keys.</text><rect x="1042" y="458" width="164" height="42" rx="18" fill="#111827" stroke="#4B6B82"/><text x="1070" y="485" class="font text" font-size="13" font-weight="900" letter-spacing="3">ADD PROVIDER</text>
    <rect x="46" y="560" width="550" height="72" rx="16" fill="#101A29" stroke="#3B5F76"/><rect x="72" y="581" width="48" height="48" rx="10" fill="#233548"/><text x="158" y="594" class="font text" font-size="17" font-weight="900">Gemini Pro Core</text><text x="158" y="620" class="font green" font-size="13">Configured through local settings</text><circle cx="558" cy="596" r="7" fill="#22C55E"/>
    <rect x="46" y="650" width="550" height="72" rx="16" fill="#101A29" stroke="#3B5F76"/><rect x="72" y="671" width="48" height="48" rx="10" fill="#312A51"/><text x="158" y="684" class="font text" font-size="17" font-weight="900">Local TTS / STT Fallback</text><text x="158" y="710" class="font muted" font-size="13">Optional voice dependencies are feature-gated</text><circle cx="558" cy="686" r="7" fill="#FBBF24"/>
    <rect x="658" y="560" width="548" height="162" rx="18" fill="#101A29" stroke="#3B5F76"/><text x="692" y="604" class="font cyan label">TELEGRAM REMOTE CONTROL</text><text x="692" y="646" class="font text" font-size="17">Token, allowlist, PC-control, terminal gate, status, start/stop, and test send.</text><rect x="692" y="674" width="110" height="32" rx="12" fill="#0B2530" stroke="#22D3EE"/><text x="716" y="696" class="font cyan" font-size="12" font-weight="900">STATUS</text><rect x="818" y="674" width="98" height="32" rx="12" fill="#0B2530" stroke="#22D3EE"/><text x="848" y="696" class="font cyan" font-size="12" font-weight="900">START</text><rect x="932" y="674" width="140" height="32" rx="12" fill="#0B2530" stroke="#22D3EE"/><text x="956" y="696" class="font cyan" font-size="12" font-weight="900">TEST SEND</text>
  </g>
</svg>
