<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHELL OS v9.1 - HyperCortex</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b0e13;
            color: #f5f6fe;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }

        /* Background Orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }

        .bg-orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #8ff5ff, transparent 70%);
            top: -150px;
            left: -150px;
            animation: orbDrift1 16s ease-in-out infinite;
        }

        .bg-orb-2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #ac89ff, transparent 70%);
            bottom: -100px;
            right: -100px;
            animation: orbDrift2 20s ease-in-out infinite;
        }

        .bg-orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ff59e3, transparent 70%);
            top: 40%;
            right: 20%;
            animation: orbDrift3 14s ease-in-out infinite;
        }

        @keyframes orbDrift1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(80px, 60px); }
        }
        @keyframes orbDrift2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-70px, -50px); }
        }
        @keyframes orbDrift3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-40px, 30px) scale(1.1); }
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px
            );
        }

        /* Layout */
        .page-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 60px 24px 80px;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            margin-bottom: 60px;
            max-width: 700px;
        }

        /* Animated Orb/Sphere */
        .hero-sphere {
            width: 160px;
            height: 160px;
            margin: 0 auto 48px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sphere-core {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #8ff5ff, #ac89ff 60%, #ff59e3);
            box-shadow:
                0 0 40px rgba(143, 245, 255, 0.4),
                0 0 80px rgba(172, 137, 255, 0.2),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            animation: spherePulse 4s ease-in-out infinite;
        }

        @keyframes spherePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(143,245,255,0.4), 0 0 80px rgba(172,137,255,0.2); }
            50% { transform: scale(1.08); box-shadow: 0 0 60px rgba(143,245,255,0.5), 0 0 120px rgba(172,137,255,0.3); }
        }

        .sphere-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(143, 245, 255, 0.2);
            animation: ringRotate 8s linear infinite;
        }

        .sphere-ring-1 {
            width: 120px; height: 120px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotateX(60deg);
        }

        .sphere-ring-2 {
            width: 140px; height: 140px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotateX(60deg) rotateY(45deg);
            border-color: rgba(172, 137, 255, 0.15);
            animation-duration: 12s;
            animation-direction: reverse;
        }

        .sphere-ring-3 {
            width: 155px; height: 155px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg) rotateZ(30deg);
            border-color: rgba(255, 89, 227, 0.1);
            animation-duration: 16s;
        }

        @keyframes ringRotate {
            from { transform: translate(-50%, -50%) rotateX(60deg) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateX(60deg) rotateZ(360deg); }
        }

        /* Sphere particles */
        .sphere-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #8ff5ff;
            opacity: 0.6;
        }

        .sp-1 { top: 10%; left: 50%; animation: spOrbit 6s linear infinite; }
        .sp-2 { top: 50%; left: 10%; animation: spOrbit 8s linear infinite reverse; background: #ac89ff; }
        .sp-3 { top: 85%; left: 60%; animation: spOrbit 10s linear infinite; background: #ff59e3; }
        .sp-4 { top: 30%; left: 85%; animation: spOrbit 7s linear infinite reverse; }

        @keyframes spOrbit {
            0% { transform: rotate(0deg) translateX(60px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(60px) rotate(-360deg); }
        }

        .hero-title {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .hero-title .highlight {
            background: linear-gradient(135deg, #8ff5ff 0%, #ac89ff 50%, #ff59e3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-title .dim {
            color: #a9abb2;
            font-weight: 400;
            font-size: 28px;
        }

        .hero-subtitle {
            font-size: 16px;
            color: #a9abb2;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* Launch Button */
        .launch-btn {
            display: inline-block;
            padding: 16px 48px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #8ff5ff 0%, #ac89ff 100%);
            color: #0b0e13;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        .launch-btn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 10px 40px rgba(143, 245, 255, 0.3),
                0 0 80px rgba(172, 137, 255, 0.15);
        }

        .launch-btn:active {
            transform: translateY(0);
        }

        .launch-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s;
        }

        .launch-btn:hover::before {
            left: 100%;
        }

        /* Feature Cards */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        .feature-card {
            background: rgba(15, 20, 35, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(143, 245, 255, 0.08);
            border-radius: 16px;
            padding: 28px 20px;
            text-align: center;
            transition: all 0.3s ease;
            animation: cardSlideUp 0.6s ease forwards;
            opacity: 0;
        }

        .feature-card:nth-child(1) { animation-delay: 0.1s; }
        .feature-card:nth-child(2) { animation-delay: 0.2s; }
        .feature-card:nth-child(3) { animation-delay: 0.3s; }
        .feature-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feature-card:hover {
            border-color: rgba(143, 245, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(143, 245, 255, 0.05);
        }

        .feature-icon {
            width: 44px;
            height: 44px;
            margin: 0 auto 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .fi-cyan { background: rgba(143, 245, 255, 0.1); color: #8ff5ff; }
        .fi-purple { background: rgba(172, 137, 255, 0.1); color: #ac89ff; }
        .fi-pink { background: rgba(255, 89, 227, 0.1); color: #ff59e3; }
        .fi-blue { background: rgba(0, 240, 255, 0.1); color: #00F0FF; }

        .feature-value {
            font-size: 22px;
            font-weight: 700;
            color: #f5f6fe;
            margin-bottom: 4px;
        }

        .feature-label {
            font-size: 12px;
            color: #a9abb2;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 28px;
            }
            .hero-title .dim {
                font-size: 20px;
            }
            .hero-subtitle {
                font-size: 13px;
                letter-spacing: 3px;
            }
            .features-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
        }

        @media (max-width: 420px) {
            .features-grid {
                grid-template-columns: 1fr;
            }
            .hero-sphere {
                width: 120px;
                height: 120px;
            }
            .sphere-core {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    <div class="scanlines"></div>

    <div class="page-wrapper">
        <section class="hero">
            <div class="hero-sphere">
                <div class="sphere-core"></div>
                <div class="sphere-ring sphere-ring-1"></div>
                <div class="sphere-ring sphere-ring-2"></div>
                <div class="sphere-ring sphere-ring-3"></div>
                <div class="sphere-particle sp-1"></div>
                <div class="sphere-particle sp-2"></div>
                <div class="sphere-particle sp-3"></div>
                <div class="sphere-particle sp-4"></div>
            </div>

            <h1 class="hero-title">
                <span class="highlight">SHELL OS v9.1</span><br>
                <span class="dim">HyperCortex</span>
            </h1>

            <p class="hero-subtitle">Voice-Controlled AI Operating System</p>

            <a href="Desktop/login_page.html" class="launch-btn">Launch Shell</a>
        </section>

        <div class="features-grid">
            <div class="feature-card">
                <div class="feature-icon fi-cyan">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
                </div>
                <div class="feature-value">298</div>
                <div class="feature-label">AI Tools</div>
            </div>

            <div class="feature-card">
                <div class="feature-icon fi-purple">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                </div>
                <div class="feature-value">8</div>
                <div class="feature-label">AI Providers</div>
            </div>

            <div class="feature-card">
                <div class="feature-icon fi-pink">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </div>
                <div class="feature-value">Live</div>
                <div class="feature-label">Voice Control</div>
            </div>

            <div class="feature-card">
                <div class="feature-icon fi-blue">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </div>
                <div class="feature-value">Active</div>
                <div class="feature-label">Vision Engine</div>
            </div>
        </div>
    </div>
</body>
</html>
