<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Shell AI OS Controller banner</title>
  <desc id="desc">Premium dark banner for the Shell AI OS Controller open-source project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="52%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1140" cy="208" r="150" fill="url(#orb)" opacity="0.75"/>
  <circle cx="1140" cy="208" r="70" fill="#22d3ee" opacity="0.9" filter="url(#glow)"/>
  <g opacity="0.35" stroke="#38bdf8" stroke-width="2">
    <path d="M80 330 C260 230 410 360 600 250 S880 190 1060 260"/>
    <path d="M180 80 C350 160 520 50 690 130 S980 230 1240 90"/>
  </g>
  <g fill="#e5f3ff">
    <text x="90" y="135" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="800" letter-spacing="0">Shell AI OS Controller</text>
    <text x="94" y="188" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" fill="#a7f3d0">AI desktop control layer for voice, tools, automation, and local workflows</text>
    <text x="94" y="252" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#cbd5e1">Version 1.0.0  |  Apache-2.0  |  Built by mdshoebking</text>
  </g>
  <g transform="translate(94 300)">
    <rect width="150" height="38" rx="10" fill="#0e7490"/>
    <text x="20" y="25" font-family="Inter, ui-sans-serif, system-ui" font-size="15" fill="#ecfeff" font-weight="700">Voice AI</text>
    <rect x="166" width="168" height="38" rx="10" fill="#155e75"/>
    <text x="186" y="25" font-family="Inter, ui-sans-serif, system-ui" font-size="15" fill="#ecfeff" font-weight="700">Automation</text>
    <rect x="350" width="175" height="38" rx="10" fill="#164e63"/>
    <text x="370" y="25" font-family="Inter, ui-sans-serif, system-ui" font-size="15" fill="#ecfeff" font-weight="700">Open Source</text>
  </g>
</svg>
