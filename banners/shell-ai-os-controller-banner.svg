<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Shell AI OS Controller official banner</title>
  <desc id="desc">Premium dark banner using the official Shell logo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020407"/>
      <stop offset="46%" stop-color="#09111b"/>
      <stop offset="100%" stop-color="#10151c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#dce7ef" stop-opacity="0"/>
      <stop offset="46%" stop-color="#f8fbff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#70e8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="46%" stop-color="#7deeff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020407" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1400" height="420" rx="32" fill="url(#bg)"/>
  <rect x="34" y="34" width="1332" height="352" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <path d="M60 312 C230 232 370 342 548 246 S820 164 1058 238 S1256 276 1344 206" fill="none" stroke="url(#line)" stroke-width="2" opacity="0.55"/>
  <path d="M70 96 C242 168 362 56 566 132 S862 238 1126 86" fill="none" stroke="#70e8ff" stroke-width="1.4" opacity="0.18"/>
  <g opacity="0.18" stroke="#ffffff" stroke-width="1">
    <path d="M86 350 H366"/>
    <path d="M1010 70 H1292"/>
    <path d="M1170 284 H1330"/>
  </g>
  <circle cx="1128" cy="210" r="232" fill="url(#glow)" filter="url(#softGlow)"/>
  <image href="../assets/brand/shell-official-logo.png" x="964" y="62" width="328" height="328" preserveAspectRatio="xMidYMid meet"/>
  <text x="90" y="142" fill="#F7FBFF" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="0">Shell AI OS Controller</text>
  <text x="94" y="198" fill="#BBD0DA" font-family="Inter, SF Pro Text, Segoe UI, Arial, sans-serif" font-size="24">AI desktop control layer for chat, voice, tools, automation, and diagnostics.</text>
  <text x="94" y="254" fill="#70E8FF" font-family="Inter, SF Pro Text, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">OPEN SOURCE · HUMAN-CONTROLLED · OBSERVABLE</text>
  <g transform="translate(94 302)">
    <rect width="162" height="42" rx="12" fill="#101923" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="22" y="27" fill="#F7FBFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Version 1.0.0</text>
    <rect x="178" width="212" height="42" rx="12" fill="#101923" stroke="#70E8FF" stroke-opacity="0.20"/>
    <text x="200" y="27" fill="#F7FBFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Built by mdshoebking</text>
    <rect x="406" width="142" height="42" rx="12" fill="#101923" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="428" y="27" fill="#F7FBFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Apache-2.0</text>
  </g>
</svg>
