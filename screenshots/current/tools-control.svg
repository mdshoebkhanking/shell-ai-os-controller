<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shell AI tools and control center</title>
  <desc id="desc">Current Shell AI tools UI showing the tool catalog, arguments JSON, run button, result panel, and guarded execution model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#05080D"/><stop offset="0.55" stop-color="#0A1220"/><stop offset="1" stop-color="#081F28"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <style>.font{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.text{fill:#F8FAFC}.muted{fill:#94A3B8}.dim{fill:#64748B}.cyan{fill:#22D3EE}.green{fill:#64E6AE}.amber{fill:#FBBF24}.card{fill:#0B1120;stroke:#64748B;stroke-width:1.4}.label{font-size:13px;letter-spacing:5px;font-weight:900}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect y="0" width="1600" height="54" fill="#05080D"/><text x="28" y="35" class="font text" font-size="24" font-weight="900">Shell</text><text x="96" y="34" class="font muted" font-size="15">Tools</text><circle cx="1520" cy="27" r="18" fill="#22D3EE"/><text x="1514" y="34" class="font" font-size="16" font-weight="900" fill="#06111A">U</text>
  <rect y="54" width="294" height="846" fill="#070B16"/>
  <circle cx="48" cy="112" r="23" fill="url(#cyan)"/><text x="40" y="120" class="font" font-size="18" font-weight="900" fill="#06111A">S</text><text x="86" y="110" class="font text" font-size="22" font-weight="900">Shell</text><text x="86" y="132" class="font muted" font-size="13">v10</text>
  <rect x="25" y="165" width="245" height="52" rx="14" fill="#22D3EE"/><text x="92" y="197" class="font" font-size="16" font-weight="900" fill="#06111A">+ New chat</text>
  <rect x="25" y="235" width="245" height="46" rx="16" fill="#0E1728" stroke="#27445B"/><text x="52" y="264" class="font muted" font-size="14">Search...</text>
  <text x="44" y="338" class="font muted label">CHATS</text><rect x="25" y="354" width="245" height="60" rx="10" fill="#132036"/><rect x="25" y="358" width="4" height="52" rx="2" fill="#22D3EE"/><text x="44" y="383" class="font text" font-size="18" font-weight="900">/mcp test {}</text><text x="44" y="408" class="font dim" font-size="13">48m ago</text>
  <rect x="25" y="564" width="245" height="54" rx="14" fill="#132036"/><rect x="25" y="568" width="4" height="46" rx="2" fill="#22D3EE"/><text x="80" y="597" class="font text" font-size="17" font-weight="900">Chat</text>
  <text x="80" y="657" class="font muted" font-size="17">Voice</text><text x="80" y="717" class="font muted" font-size="17">System</text><text x="80" y="777" class="font muted" font-size="17">Tools</text><text x="80" y="837" class="font muted" font-size="17">Settings</text>

  <g transform="translate(325 82)">
    <rect x="0" y="0" width="456" height="760" rx="10" class="card"/>
    <text x="22" y="48" class="font text" font-size="28" font-weight="950">Tools / MCP</text><rect x="344" y="22" width="86" height="42" rx="12" fill="#111827" stroke="#94A3B8"/><text x="365" y="49" class="font text" font-size="14" font-weight="900">Refresh</text>
    <text x="22" y="86" class="font muted" font-size="14">468 items (17 MCP, 408 tools, 43 agents) | local | MCP offline</text>
    <rect x="22" y="105" width="408" height="42" rx="10" fill="#050914" stroke="#64748B"/><text x="40" y="132" class="font muted" font-size="15">Search backend tools</text>
    <rect x="22" y="162" width="408" height="42" rx="10" fill="#050914" stroke="#64748B"/><text x="40" y="189" class="font text" font-size="15">All</text><text x="406" y="190" class="font muted" font-size="16">▾</text>
    <g class="font" font-size="16" font-weight="900">
      <rect x="22" y="218" width="392" height="68" rx="10" fill="#132036" stroke="#94A3B8"/><text x="38" y="250" class="text">Windows Click</text><text x="38" y="273" class="text">windows | windows-mcp</text>
      <rect x="22" y="296" width="392" height="68" rx="10" fill="#132036" stroke="#64748B"/><text x="38" y="328" class="text">Windows Type</text><text x="38" y="351" class="text">windows | windows-mcp</text>
      <rect x="22" y="374" width="392" height="68" rx="10" fill="#132036" stroke="#64748B"/><text x="38" y="406" class="text">Windows Scroll</text><text x="38" y="429" class="text">windows | windows-mcp</text>
      <rect x="22" y="452" width="392" height="68" rx="10" fill="#132036" stroke="#64748B"/><text x="38" y="484" class="text">Image Generate</text><text x="38" y="507" class="text">media | gallery</text>
      <rect x="22" y="530" width="392" height="68" rx="10" fill="#132036" stroke="#64748B"/><text x="38" y="562" class="text">Telegram Status</text><text x="38" y="585" class="text">remote | settings</text>
    </g>
  </g>
  <g transform="translate(805 82)">
    <rect x="0" y="0" width="734" height="760" rx="10" class="card"/>
    <text x="26" y="48" class="font text" font-size="30" font-weight="950">Windows Click</text><text x="26" y="82" class="font dim" font-size="14">windows_mcp_tool | windows | windows-mcp:Click | risk: guarded</text>
    <text x="26" y="118" class="font text" font-size="17">Click on the Windows desktop at coordinates or a resolved target.</text>
    <text x="26" y="154" class="font muted" font-size="15" font-weight="900">Arguments JSON</text>
    <rect x="26" y="178" width="682" height="235" rx="10" fill="#050914" stroke="#94A3B8"/><text x="50" y="224" class="mono text" font-size="18">{</text><text x="76" y="254" class="mono text" font-size="18">"x": 0,</text><text x="76" y="284" class="mono text" font-size="18">"y": 0,</text><text x="76" y="314" class="mono text" font-size="18">"button": "left"</text><text x="50" y="344" class="mono text" font-size="18">}</text>
    <rect x="26" y="436" width="62" height="40" rx="10" fill="#22D3EE"/><text x="46" y="462" class="font" font-size="14" font-weight="900" fill="#06111A">Run</text>
    <rect x="104" y="436" width="122" height="40" rx="10" fill="#111827" stroke="#94A3B8"/><text x="128" y="462" class="font text" font-size="14" font-weight="900">Send to chat</text>
    <text x="26" y="516" class="font muted" font-size="15" font-weight="900">Result</text><rect x="26" y="538" width="682" height="170" rx="10" fill="#050914" stroke="#94A3B8"/>
    <text x="52" y="588" class="mono green" font-size="16">ready: safety gate active</text><text x="52" y="624" class="mono muted" font-size="16">dry_run: false only after user approval</text><text x="52" y="660" class="mono amber" font-size="16">platform: Windows driver preferred, fallback available</text>
  </g>
</svg>
