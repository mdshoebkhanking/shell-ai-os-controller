<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Shell AI beginner installation flow demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="1" stop-color="#0b1720"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <style>
      .title{font:800 42px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .sub{font:600 20px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .step{font:800 22px Inter,Segoe UI,Arial,sans-serif;fill:#e0f2fe}
      .body{font:600 17px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .mono{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#cffafe}
      @keyframes sweep{0%{stroke-dashoffset:900}100%{stroke-dashoffset:0}}
      @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
      .path{stroke:#22d3ee;stroke-width:5;stroke-dasharray:22 18;animation:sweep 6s linear infinite}
      .glow{animation:glow 2.4s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="64" y="54" width="1152" height="612" rx="34" fill="#070b12" stroke="#1e293b"/>
  <text x="98" y="118" class="title">One-Click Install Experience</text>
  <text x="100" y="154" class="sub">Download, install, launch, and start using Shell without manual Python setup.</text>
  <path class="path" d="M198 388 H1062" fill="none"/>
  <g transform="translate(110 230)">
    <rect width="220" height="250" rx="24" fill="#0b1220" stroke="#164e63"/>
    <circle cx="110" cy="76" r="42" fill="url(#ok)" class="glow"/>
    <text x="50" y="152" class="step">1. Download</text>
    <text x="34" y="190" class="body">Get the release zip or installer package.</text>
  </g>
  <g transform="translate(390 230)">
    <rect width="220" height="250" rx="24" fill="#0b1220" stroke="#164e63"/>
    <rect x="44" y="44" width="132" height="70" rx="18" fill="#082f49" stroke="#0e7490"/>
    <text x="62" y="88" class="mono">Install</text>
    <text x="50" y="152" class="step">2. Run setup</text>
    <text x="34" y="190" class="body">Dependencies and venv are prepared automatically.</text>
  </g>
  <g transform="translate(670 230)">
    <rect width="220" height="250" rx="24" fill="#0b1220" stroke="#164e63"/>
    <path d="M88 50 L150 86 L88 122 Z" fill="url(#ok)" class="glow"/>
    <text x="54" y="152" class="step">3. Start Shell</text>
    <text x="34" y="190" class="body">Launchers start the hub and desktop UI together.</text>
  </g>
  <g transform="translate(950 230)">
    <rect width="220" height="250" rx="24" fill="#0b1220" stroke="#164e63"/>
    <circle cx="110" cy="84" r="50" fill="#020617" stroke="#22d3ee"/>
    <circle cx="110" cy="84" r="24" fill="url(#ok)" class="glow"/>
    <text x="48" y="152" class="step">4. Use AI</text>
    <text x="34" y="190" class="body">Chat, voice, tools, and diagnostics are ready.</text>
  </g>
  <rect x="264" y="560" width="752" height="46" rx="23" fill="#020617" stroke="#334155"/>
  <text x="302" y="590" class="mono">Windows: Start_ShellAI.bat   macOS: start_shellai.command   Linux: start_shellai.sh</text>
</svg>
