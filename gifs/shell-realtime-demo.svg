<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Shell AI realtime chat and voice demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.55" stop-color="#0a1018"/>
      <stop offset="1" stop-color="#07151a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title{font:700 38px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .small{font:600 18px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .label{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe}
      .mono{font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#cffafe}
      .panel{fill:#0b1220;stroke:#1e3a4a;stroke-width:1.2}
      .line{stroke:#22d3ee;stroke-width:3;stroke-linecap:round;opacity:.9}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:1;transform:scale(1.05)}}
      @keyframes stream{0%{stroke-dashoffset:360}100%{stroke-dashoffset:0}}
      @keyframes type{0%,20%{opacity:0}28%,100%{opacity:1}}
      @keyframes rise{0%{transform:translateY(12px);opacity:0}28%,100%{transform:translateY(0);opacity:1}}
      .pulse{transform-origin:980px 350px;animation:pulse 2.2s ease-in-out infinite}
      .stream{stroke-dasharray:18 16;animation:stream 5s linear infinite}
      .t1{animation:type 6s infinite}.t2{animation:type 6s .7s infinite}.t3{animation:type 6s 1.4s infinite}
      .rise1{animation:rise 6s infinite}.rise2{animation:rise 6s .8s infinite}.rise3{animation:rise 6s 1.6s infinite}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="44" y="42" width="1192" height="636" rx="28" fill="#070b12" stroke="#172554"/>
  <g transform="translate(78 72)">
    <rect x="0" y="0" width="1124" height="56" rx="18" fill="#0b1220" stroke="#1e293b"/>
    <circle cx="28" cy="28" r="10" fill="#ef4444"/>
    <circle cx="58" cy="28" r="10" fill="#f59e0b"/>
    <circle cx="88" cy="28" r="10" fill="#10b981"/>
    <text x="126" y="36" class="small">Shell AI OS Controller v1.0.0</text>
    <rect x="876" y="12" width="210" height="32" rx="16" fill="#082f49" stroke="#0e7490"/>
    <circle class="pulse" cx="902" cy="28" r="6" fill="#22d3ee"/>
    <text x="922" y="35" class="label">Realtime mode active</text>
  </g>
  <g transform="translate(88 154)">
    <rect class="panel" width="270" height="470" rx="22"/>
    <rect x="28" y="34" width="74" height="74" rx="18" fill="url(#cyan)" filter="url(#softGlow)"/>
    <text x="122" y="66" class="title" font-size="28">Shell</text>
    <text x="122" y="94" class="small">AI operating layer</text>
    <rect x="28" y="142" width="214" height="44" rx="14" fill="#0e7490"/>
    <text x="96" y="171" class="label">+ New chat</text>
    <rect x="28" y="214" width="214" height="48" rx="14" fill="#111c31" stroke="#164e63"/>
    <text x="58" y="244" class="label">Chat</text>
    <rect x="28" y="278" width="214" height="48" rx="14" fill="#0f172a" stroke="#334155"/>
    <text x="58" y="308" class="small">Voice</text>
    <rect x="28" y="342" width="214" height="48" rx="14" fill="#0f172a" stroke="#334155"/>
    <text x="58" y="372" class="small">Tools</text>
  </g>
  <g transform="translate(386 154)">
    <rect class="panel" width="510" height="470" rx="22"/>
    <text x="30" y="48" class="title" font-size="26">Chat</text>
    <g class="rise1">
      <rect x="30" y="84" width="315" height="58" rx="18" fill="#111827" stroke="#1f2937"/>
      <text x="54" y="119" class="small">Open YouTube and play music</text>
    </g>
    <g class="rise2">
      <rect x="150" y="172" width="330" height="86" rx="18" fill="#062a38" stroke="#0e7490"/>
      <text x="174" y="205" class="mono t1">Routing: browser automation</text>
      <text x="174" y="232" class="mono t2">Tool state: permission-aware</text>
    </g>
    <g class="rise3">
      <rect x="30" y="296" width="450" height="94" rx="18" fill="#0b1726" stroke="#164e63"/>
      <text x="54" y="329" class="mono t1">Shell streams text instantly...</text>
      <text x="54" y="356" class="mono t2">Voice can play only when requested.</text>
      <text x="54" y="383" class="mono t3">Trace saved for debugging.</text>
    </g>
    <rect x="30" y="420" width="450" height="34" rx="17" fill="#020617" stroke="#334155"/>
    <text x="54" y="443" class="small">Type a command...</text>
  </g>
  <g transform="translate(928 154)">
    <rect class="panel" width="264" height="470" rx="22"/>
    <text x="28" y="48" class="title" font-size="26">Voice</text>
    <circle cx="132" cy="210" r="78" fill="#020617" stroke="#155e75" stroke-width="2"/>
    <circle class="pulse" cx="132" cy="210" r="48" fill="url(#cyan)" opacity=".9" filter="url(#softGlow)"/>
    <path class="line stream" d="M54 340 C86 312, 118 368, 150 340 S214 368, 238 340"/>
    <text x="44" y="396" class="label">Low-latency response path</text>
    <text x="44" y="426" class="small">Text first. Voice on demand.</text>
  </g>
</svg>
